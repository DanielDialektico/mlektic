[project]
name = "mlektic"
version = "0.1.0"
description = "A visual library for understanding the mathematical evolution of machine learning models."
readme = "README.md"
authors = [
    { name = "Mlektic Author" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scikit-learn",
    "plotly"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.4",
]
