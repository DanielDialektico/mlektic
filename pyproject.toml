[project]
name = "mlektic"
version = "0.1.0"
description = "A visual library for understanding the mathematical evolution of machine learning models."
readme = "README.md"
authors = [
    { name = "Mlektic Author" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scikit-learn",
    "plotly"
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    ".venv",
    "codeasdoc/_build",
    "local_test",
    "old_mlektic_core",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D105", "D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103"]
"codeasdoc/conf.py" = ["D100"]
"src/mlektic/visualization/**/*.py" = ["E501"]
"src/mlektic/visualization/**/prediction.py" = ["D100"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "nbformat>=5.10.4",
    "pytest>=8.4.2",
    "ruff>=0.15.4",
]
