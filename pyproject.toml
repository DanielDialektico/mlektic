[project]
name = "mlektic"
version = "0.1.0"
description = "A visual library for understanding the mathematical evolution of machine learning models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mlektic Author" }
]
requires-python = ">=3.9"
keywords = [
    "machine-learning",
    "education",
    "visualization",
    "scikit-learn",
    "pytorch",
    "plotly",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "scikit-learn",
    "plotly"
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
dev = [
    "build",
    "nbclient",
    "nbformat",
    "pytest",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
]
notebooks = [
    "ipykernel",
    "nbclient",
    "nbformat",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Documentation = "https://github.com/DanielDialektico/mlektic/tree/main/codeasdoc"
Issues = "https://github.com/DanielDialektico/mlektic/issues"
Repository = "https://github.com/DanielDialektico/mlektic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    ".venv",
    "codeasdoc/_build",
    "local_test",
    "old_mlektic_core",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D105", "D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103"]
"codeasdoc/conf.py" = ["D100"]
"scripts/generate_notebooks.py" = ["D103", "E501"]
"src/mlektic/visualization/**/*.py" = ["E501"]
"src/mlektic/visualization/**/prediction.py" = ["D100"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "ipykernel>=6.31.0",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pytest>=8.4.2",
    "ruff>=0.15.4",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.0.2",
]
