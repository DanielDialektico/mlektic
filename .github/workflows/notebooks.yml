name: Notebook visual QA

on:
  pull_request:
  workflow_dispatch:
    inputs:
      group:
        description: Notebook group to execute
        required: true
        default: all
        type: choice
        options: [smoke, core, all]
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[notebooks]"
      - run: python scripts/execute_notebooks.py --group smoke

  complete-matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[notebooks,torch]"
      - name: Execute requested or scheduled full matrix
        shell: bash
        run: |
          GROUP="${{ inputs.group }}"
          if [ -z "$GROUP" ]; then GROUP="all"; fi
          python scripts/execute_notebooks.py --group "$GROUP" --timeout 420
