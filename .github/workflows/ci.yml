name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Python ${{ matrix.python-version }} core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  quality-package-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts codeasdoc
      - run: python scripts/validate_notebook_policy.py
      - run: sphinx-build -W -b html codeasdoc codeasdoc/_build/html
      - run: python -m build
      - name: Clean wheel install and import smoke test
        run: |
          python -m venv /tmp/mlektic-wheel
          /tmp/mlektic-wheel/bin/python -m pip install dist/*.whl
          /tmp/mlektic-wheel/bin/python -c "import mlektic; print(mlektic.__version__)"
  torch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,torch]"
      - run: python -m pytest tests/test_api_neural.py tests/test_phase3_visual_design.py
